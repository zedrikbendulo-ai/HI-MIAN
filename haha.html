<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Will You Be My Girlfriend?</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            font-family: "Segoe UI", sans-serif;

            background:
                radial-gradient(circle at top left, #ffd6e7, transparent 35%),
                radial-gradient(circle at bottom right, #ffc1d9, transparent 35%),
                linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ==========================================
                    FLOATING HEARTS
        ========================================== */

        .heart {
            position: fixed;
            bottom: -50px;

            font-size: 25px;

            animation: floatUp linear infinite;

            opacity: 0.8;

            pointer-events: none;

            z-index: 1;
        }

        @keyframes floatUp {

            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        .heart:nth-child(1) {
            left: 5%;
            animation-duration: 7s;
            animation-delay: 0s;
        }

        .heart:nth-child(2) {
            left: 15%;
            animation-duration: 9s;
            animation-delay: 2s;
        }

        .heart:nth-child(3) {
            left: 30%;
            animation-duration: 6s;
            animation-delay: 1s;
        }

        .heart:nth-child(4) {
            left: 45%;
            animation-duration: 10s;
            animation-delay: 3s;
        }

        .heart:nth-child(5) {
            left: 60%;
            animation-duration: 8s;
            animation-delay: 1s;
        }

        .heart:nth-child(6) {
            left: 75%;
            animation-duration: 7s;
            animation-delay: 4s;
        }

        .heart:nth-child(7) {
            left: 90%;
            animation-duration: 11s;
            animation-delay: 2s;
        }


        /* ==========================================
                        MAIN CARD
        ========================================== */

        .card {
            position: relative;

            width: 90%;
            max-width: 500px;

            min-height: 450px;

            padding: 45px 30px;

            text-align: center;

            background: rgba(255, 255, 255, 0.25);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border: 1px solid rgba(255, 255, 255, 0.45);

            border-radius: 30px;

            box-shadow:
                0 20px 50px rgba(120, 30, 70, 0.25),
                inset 0 0 30px rgba(255, 255, 255, 0.15);

            z-index: 10;
        }


        /* ==========================================
                        BIG HEART
        ========================================== */

        .big-heart {
            font-size: 70px;

            animation: heartbeat 1.5s infinite;

            filter:
                drop-shadow(0 5px 10px rgba(255, 60, 120, 0.3));
        }

        @keyframes heartbeat {

            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }


        /* ==========================================
                            TITLE
        ========================================== */

        h1 {
            margin-top: 15px;

            color: #8e244d;

            font-size: 32px;

            text-shadow:
                0 2px 5px rgba(255, 255, 255, 0.5);
        }


        /* ==========================================
                         MESSAGE
        ========================================== */

        .message {
            margin-top: 15px;

            color: #70213f;

            font-size: 17px;

            line-height: 1.6;
        }


        /* ==========================================
                         QUESTION
        ========================================== */

        .question {
            margin-top: 20px;

            font-size: 24px;

            font-weight: bold;

            color: #a32152;

            transition: 0.3s;
        }


        /* ==========================================
                          BUTTON AREA
        ========================================== */

        .buttons {
            position: relative;

            height: 120px;

            margin-top: 25px;
        }

        button {
            border: none;

            cursor: pointer;

            font-family: inherit;

            border-radius: 50px;

            transition: 0.3s ease;
        }


        /* ==========================================
              YES BUTTON
              TINY + TRANSPARENT + TOP RIGHT
        ========================================== */

        #yesBtn {

            position: absolute;

            right: 5px;

            top: 0px;

            padding: 4px 8px;

            font-size: 9px;

            font-weight: 600;

            color: rgba(255, 255, 255, 0.55);

            background: rgba(255, 255, 255, 0.08);

            border:
                1px solid rgba(255, 255, 255, 0.18);

            border-radius: 15px;

            backdrop-filter: blur(7px);
            -webkit-backdrop-filter: blur(7px);

            box-shadow:
                0 3px 10px rgba(255, 255, 255, 0.08);

            opacity: 0.5;

            z-index: 20;
        }

        #yesBtn:hover {

            opacity: 1;

            transform: scale(1.15);

            color: white;

            background:
                rgba(255, 255, 255, 0.22);

            box-shadow:
                0 5px 15px rgba(255, 105, 150, 0.25);
        }


        /* ==========================================
                         NO BUTTON
        ========================================== */

        #noBtn {

            position: absolute;

            left: 30px;

            top: 45px;

            padding: 10px 22px;

            font-size: 16px;

            font-weight: bold;

            background: rgba(255, 255, 255, 0.85);

            color: #d93668;

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.15);
        }

        #noBtn:hover {

            background: white;

            transform: scale(1.05);
        }


        /* ==========================================
                        SUCCESS MESSAGE
        ========================================== */

        #success {

            display: none;

            margin-top: 20px;

            color: #a32152;

            font-size: 20px;

            font-weight: bold;

            line-height: 1.6;

            animation: pop 0.5s ease;

        }

        @keyframes pop {

            from {
                transform: scale(0);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }


        /* ==========================================
                         MOBILE DESIGN
        ========================================== */

        @media (max-width: 500px) {

            .card {

                width: 92%;

                padding:
                    35px 20px;

                min-height: 430px;
            }

            .big-heart {

                font-size: 60px;
            }

            h1 {

                font-size: 26px;
            }

            .question {

                font-size: 21px;
            }

            .message {

                font-size: 15px;
            }

            #yesBtn {

                right: 3px;

                top: 0;

                font-size: 8px;

                padding: 3px 7px;
            }

            #noBtn {

                left: 20px;

                top: 45px;
            }
        }

    </style>
</head>


<body>


    <!-- ==========================================
                     FLOATING HEARTS
    =========================================== -->

    <div class="heart">❤️</div>
    <div class="heart">💕</div>
    <div class="heart">💗</div>
    <div class="heart">💖</div>
    <div class="heart">💘</div>
    <div class="heart">💞</div>
    <div class="heart">❤️</div>


    <!-- ==========================================
                       MAIN CARD
    =========================================== -->

    <div class="card">

        <div class="big-heart">
            💗
        </div>


        <h1>
            My Little Love Letter 💌
        </h1>


        <p class="message">

            I have something I want to ask you...

            <br>

            You are someone really special to me,
            and I would love to have more beautiful
            memories with you. ❤️

        </p>


        <p class="question">

            Will you be my girlfriend? 💕

        </p>


        <!-- ==========================================
                         BUTTONS
        =========================================== -->

        <div class="buttons">


            <!-- TINY YES BUTTON -->

            <button id="yesBtn">
                Yes 💖
            </button>


            <!-- RUNNING NO BUTTON -->

            <button id="noBtn">
                No 😭
            </button>


        </div>


        <!-- ==========================================
                         SUCCESS MESSAGE
        =========================================== -->

        <div id="success">

            YAY! 💕 You said YES!

            <br>

            Chati kos FB na kita na HAHAHAHHAH! 😂💗

            <br>

            I'm so happy! 🥰💕

        </div>

    </div>



    <!-- ==========================================
                       JAVASCRIPT
    =========================================== -->

    <script>

        const noBtn =
            document.getElementById("noBtn");

        const yesBtn =
            document.getElementById("yesBtn");

        const success =
            document.getElementById("success");


        /* ==========================================
                MOVE NO BUTTON
        ========================================== */

        function moveNoButton() {

            const buttons =
                document.querySelector(".buttons");

            const buttonsRect =
                buttons.getBoundingClientRect();

            const buttonRect =
                noBtn.getBoundingClientRect();


            /*
                Keep the button inside
                the button area.
            */

            const maxX =
                buttonsRect.width -
                buttonRect.width -
                5;

            const maxY =
                buttonsRect.height -
                buttonRect.height -
                5;


            const randomX =
                Math.max(
                    0,
                    Math.random() * maxX
                );

            const randomY =
                Math.max(
                    0,
                    Math.random() * maxY
                );


            noBtn.style.left =
                randomX + "px";

            noBtn.style.top =
                randomY + "px";
        }


        /* ==========================================
                 DESKTOP MOUSE
        ========================================== */

        noBtn.addEventListener(
            "mouseenter",
            moveNoButton
        );


        /* ==========================================
                 MOBILE TOUCH
        ========================================== */

        noBtn.addEventListener(
            "touchstart",
            function(event) {

                event.preventDefault();

                moveNoButton();

            }
        );


        /* ==========================================
                 IF USER CLICKS NO
        ========================================== */

        noBtn.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                moveNoButton();

            }
        );


        /* ==========================================
                    YES BUTTON
        ========================================== */

        yesBtn.addEventListener(
            "click",
            function() {

                /*
                    Change question
                */

                document.querySelector(
                    ".question"
                ).innerHTML =
                    "Awww... You said YES! 💕";


                /*
                    Show message
                */

                success.style.display =
                    "block";


                /*
                    Hide buttons
                */

                yesBtn.style.display =
                    "none";

                noBtn.style.display =
                    "none";


                /*
                    Create lots of hearts
                */

                createExtraHearts();

            }
        );


        /* ==========================================
                    EXTRA HEARTS
        ========================================== */

        function createExtraHearts() {

            const heartTypes = [
                "❤️",
                "💕",
                "💗",
                "💖",
                "💘",
                "💞",
                "🥰"
            ];


            for (
                let i = 0;
                i < 30;
                i++
            ) {

                const heart =
                    document.createElement("div");


                heart.classList.add(
                    "heart"
                );


                heart.innerHTML =
                    heartTypes[
                        Math.floor(
                            Math.random() *
                            heartTypes.length
                        )
                    ];


                heart.style.left =
                    Math.random() * 100 + "%";


                heart.style.fontSize =
                    (
                        15 +
                        Math.random() * 30
                    ) + "px";


                heart.style.animationDuration =
                    (
                        4 +
                        Math.random() * 6
                    ) + "s";


                heart.style.animationDelay =
                    (
                        Math.random() * 2
                    ) + "s";


                document.body.appendChild(
                    heart
                );


                /*
                    Remove old hearts
                    after animation
                */

                setTimeout(
                    () => {
                        heart.remove();
                    },
                    12000
                );
            }
        }

    </script>

</body>
</html>
